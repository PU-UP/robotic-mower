  <header class="topbar"><a class="brand" href="#"><span class="brand-mark">R</span> RLCP <span class="brand-sub">/ 架构设计工作台</span></a><span class="draft"><i></i> 讨论稿 · v0.4</span></header>
  <main>

    <section class="workbench" aria-label="交互式架构图">
      <div class="viewbar"><div class="segmented" id="views" aria-label="部署视图"><button data-view="logical" aria-pressed="true">逻辑职责</button><button data-view="ipc" aria-pressed="false">当前三进程</button><button data-view="single" aria-pressed="false">单进程候选</button></div><button class="quiet" id="reset">重置视图 ↺</button></div>
      <div class="view-note" id="view-note">连线表示逻辑交互，不规定进程、线程或类的划分。点击模块或连线查看职责与接口。</div>
      <div class="process-groups" id="process-groups" aria-label="当前三个算法进程"></div><p class="process-note">决策模块含调度核心、Anomaly、Map Server；下图拆开绘制便于查看职责。Business_core 保持外部业务角色；TF 是 SLAM 接口。分组表示当前部署方向，不规定线程或类。</p>
      <div class="workspace"><div class="diagram-pane">
        <div class="topicbar" aria-label="架构专题"><button data-topic="main" aria-pressed="true">系统总览</button><button data-topic="mapping" aria-pressed="false">定位与地图</button><button data-topic="assets" aria-pressed="false">地图协作</button><button data-topic="orchestration" aria-pressed="false">调度与异常</button></div><p id="topic-note" class="topic-note"></p>
        <div class="graph-toolbar"><div id="filters" class="filters" aria-label="连线类型"><button data-filter="main" aria-pressed="true">主链路</button><button data-filter="data" aria-pressed="false">数据</button><button data-filter="command" aria-pressed="false">指令</button><button data-filter="feedback" aria-pressed="false">反馈</button><button data-filter="all" aria-pressed="false">全部</button></div><label class="suggestions"><input id="suggestions" type="checkbox" checked> 显示补充建议</label></div>
        <div class="graph-scroll" tabindex="0" aria-label="架构画布，可横向滚动"><div class="graph" id="graph"><svg id="connections" viewBox="0 0 1480 960" aria-label="模块间有向接口"></svg><div id="nodes"></div></div></div>
        <div class="legend"><span><i class="line data"></i> 数据流</span><span><i class="line command"></i> 指令流</span><span><i class="line feedback"></i> 反馈 / 事件</span><span><i class="line proposed"></i> 补充建议</span><span class="legend-note">箭头指向接收方 · TF 为公共接口 · 角色不等于进程</span></div>
        <div class="walkthrough"><div class="walk-head"><span class="eyebrow">沿链路查看</span><select id="scenario" aria-label="选择交互流程"><option value="navigate">规划与执行</option><option value="recover">阻塞与恢复</option><option value="mapping">环境到地图</option></select><button class="quiet" id="exit-walk" hidden>退出演示</button></div><div class="walk-body"><span id="step-counter">—</span><div><strong id="step-title">用一条真实协作链路检查职责</strong><p id="step-text">按步骤高亮接口。演示的是建议交互顺序，不是机器人实时状态。</p></div><button id="previous" aria-label="上一步" disabled>←</button><button id="next">开始演示 →</button></div></div>
      </div><aside id="inspector" class="inspector" tabindex="-1" aria-label="职责与接口详情" aria-live="polite"></aside></div>
    </section>

<script>
// Logical architecture; confirmed responsibilities and proposed protocols remain distinct.
const architecture = {
  modules: [
    {"id":"sensors","name":"Sensors","cn":"定位传感器","x":30,"y":30,"kind":"external","tag":"系统输入","summary":"提供激光、IMU 与里程计原始观测。","owns":"原始观测与采样时间；驱动归属不在本图展开。","parts":[["LiDAR","点云与采样时刻。"],["IMU / Odom","惯性与轮式里程计观测。"]],"boundary":"坐标外参、时间同步和观测有效性必须在接口中定义。","role":"外部输入 / 输出"},

function stepBy(delta){const flow=scenarios[state.scenario];state.step=(state.step+delta+flow.steps.length)%flow.steps.length;state.edge=flow.steps[state.step][0];state.selected=null;state.suggestions=true;render();}
$('next').addEventListener('click',()=>stepBy(1));$('previous').addEventListener('click',()=>stepBy(-1));
$('exit-walk').addEventListener('click',()=>{leaveWalk();state.edge=null;state.selected=null;render();});
$('reset').addEventListener('click',()=>{Object.assign(state,{view:'logical',filter:'main',topic:'main',suggestions:true,selected:null,edge:null,scenario:'navigate',step:-1});$('scenario').value='navigate';render();});
$('print')?.addEventListener('click',()=>window.print());
if($('question-list')) $('question-list').innerHTML=questions.map(([s,t,d])=>`<article class="question"><span class="status">${s}</span><h3>${t}</h3><p>${d}</p></article>`).join('');
$('process-groups').innerHTML=processes.map(p=>`<article class="process-card process-${p.id}"><strong>${p.name}</strong><p>${p.members.filter(id=>id!=='tf').map(id=>names[id]).join(' · ')}</p><small>${p.note}</small></article>`).join('');
$('scenario').innerHTML=Object.entries(scenarios).map(([id,s])=>`<option value="${id}">${s.name}</option>`).join('');
render();

</script>
</body></html>
